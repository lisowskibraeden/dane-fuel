name: Diagnose scheduled dispatch
on:
  workflow_dispatch:
  schedule:
    - cron: '58 16 * * *'
permissions:
  contents: read
jobs:
  dispatched:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record actual schedule dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          date -u
          echo "Event: $EVENT_NAME"
          echo "Schedule: $CRON_SCHEDULE"
