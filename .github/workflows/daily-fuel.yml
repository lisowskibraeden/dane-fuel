name: Daily fuel updates
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '35 15 * * *'
    - cron: '35 16 * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    uses: ./.github/workflows/update-and-deploy.yml
