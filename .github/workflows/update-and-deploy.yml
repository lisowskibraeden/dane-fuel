name: Refresh prices and deploy Pages
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which data to update (scheduled runs select automatically). '
        type: choice
        options: [all, stations, terminal]
        default: all
      private_test:
        description: 'Run one private verification after confirming an enforced $0 Actions budget. Does not deploy Pages.'
        type: boolean
        default: false
      require_gasbuddy:
        description: 'Require GasBuddy and all configured searches to complete.'
        type: boolean
        default: true
      smoke:
        description: 'Test Madison only before a full county-area run.'
        type: boolean
        default: false
  schedule:
    # UTC triggers; the gate selects 5 AM stations and 10:35 AM terminal for DST.
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '35 15 * * *'
    - cron: '35 16 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fuel-update-and-pages
  cancel-in-progress: false
jobs:
  schedule:
    # Recurring updates require a public repo. Private runs are explicit tests.
    if: (github.event.repository.private == false && vars.ENABLE_FREE_UPDATES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.private_test == true)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.due.outputs.run }}
      mode: ${{ steps.due.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Select Central-time collection slot
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode || 'all' }}
        run: node scripts/schedule.mjs >> "$GITHUB_OUTPUT"
  update:
    needs: schedule
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      collected: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - if: needs.schedule.outputs.mode != 'terminal'
        run: npx playwright install --with-deps chrome
      - name: Collect public reports
        id: collect
        continue-on-error: true
        env:
          COLLECTION_MODE: ${{ needs.schedule.outputs.mode }}
          REQUIRE_GASBUDDY: ${{ github.event_name != 'workflow_dispatch' || inputs.require_gasbuddy }}
          SMOKE_TEST: ${{ inputs.smoke }}
        run: |
          if [ "$COLLECTION_MODE" = 'terminal' ]; then
            node scripts/update-terminal.mjs --require-current
            exit 0
          fi
          args=(--headed --chrome --standard-chrome)
          if [ "$REQUIRE_GASBUDDY" = 'true' ]; then args+=(--require-gasbuddy); fi
          if [ "$SMOKE_TEST" = 'true' ]; then args+=(--smoke); fi
          if [ "$COLLECTION_MODE" = 'stations' ]; then
            xvfb-run -a node scripts/collect.mjs "${args[@]}"
          else
            xvfb-run -a npm run collect -- "${args[@]}"
          fi
      - name: Preserve results and attempt status
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: bash scripts/push-updates.sh
      - name: Surface private test failure
        if: github.event.repository.private && steps.collect.outcome == 'failure'
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('site/data/prices.json')); console.error(d.message); for(const p of d.pages||[]) if(p.error||p.status==='blocked') console.error(p.town,p.status,p.error||'');"
          exit 1
      - name: Upload site
        if: github.event.repository.private == false && vars.ENABLE_FREE_UPDATES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event.repository.private == false && vars.ENABLE_FREE_UPDATES == 'true'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface collector failure after publishing status
        if: needs.update.outputs.collected == 'failure'
        run: |
          echo 'Price collection failed. The site displays the failed attempt and original report ages.'
          exit 1
