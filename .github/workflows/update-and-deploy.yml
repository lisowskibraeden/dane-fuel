name: Refresh prices and deploy Pages
on:
  workflow_dispatch:
    inputs:
      private_test:
        description: 'Run one private verification after confirming an enforced $0 Actions budget. Does not deploy Pages.'
        type: boolean
        default: false
      require_gasbuddy:
        description: 'Fail this test if collection falls back to another provider.'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fuel-update-and-pages
  cancel-in-progress: false
jobs:
  update:
    # Recurring updates require a public repo. Private runs are explicit, one-time tests.
    if: (github.event.repository.private == false && vars.ENABLE_FREE_UPDATES == 'true') || (github.event_name == 'workflow_dispatch' && inputs.private_test == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      collected: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - name: Collect public reports
        id: collect
        continue-on-error: true
        env:
          REQUIRE_GASBUDDY: ${{ inputs.require_gasbuddy }}
        run: |
          args=(--headed --chrome --standard-chrome)
          if [ "$REQUIRE_GASBUDDY" = 'true' ]; then args+=(--require-gasbuddy); fi
          xvfb-run -a npm run collect -- "${args[@]}"
      - name: Preserve results and attempt status
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/prices.json site/data/county-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update fuel reports and collection status'
            git push
          fi
      - name: Surface private test failure
        if: github.event.repository.private && steps.collect.outcome == 'failure'
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const d=JSON.parse(fs.readFileSync('site/data/prices.json')); console.error(d.message); for(const p of d.pages||[]) if(p.error||p.status==='blocked') console.error(p.town,p.status,p.error||'');"
          exit 1
      - name: Upload site
        if: github.event.repository.private == false && vars.ENABLE_FREE_UPDATES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event.repository.private == false && vars.ENABLE_FREE_UPDATES == 'true'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface collector failure after publishing status
        if: needs.update.outputs.collected == 'failure'
        run: |
          echo 'Price collection failed. The site displays the failed attempt and original report ages.'
          exit 1
